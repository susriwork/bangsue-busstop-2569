function nearestLine(lat, lng){
  let best = null, bd = Infinity;
  ROAD_LINES.forEach(r => { for (let i = 0; i < r.coords.length - 1; i++) { const d = segDist([lat, lng], r.coords[i], r.coords[i+1]); if (d < bd) { bd = d; best = r.name; } } });
  return bd <= ROAD_NEAR_M ? best : null;
}
POINTS.forEach(p => { p.line = nearestLine(p.latD, p.lngD); });
const hasShelter = p => !!p.shelterForm && !/ไม่มี/.test(p.shelterForm);
const lampBroken = p => hasShelter(p) && /ไฟ/.test(p.shelterStatus || "");
const chairBroken = p => /เก้าอี้/.test(p.shelterStatus || "");
const isDigital = p => /ดิจิ/.test(p.signForm || "");
const tempYes = p => /^มี/.test(p.tempLamp || "");
const signForm = p => !p.signForm || /ไม่มี/.test(p.signForm) ? null : isDigital(p) ? "ป้ายดิจิทัล" : /ใหม่/.test(p.signForm) ? "ป้ายแบบใหม่" : "ป้ายเก่า";
const signText = p => { const f = signForm(p); if (!f) return null; const s = p.signStatus && p.signStatus !== "ปกติ" ? ` · ${p.signStatus}` : ""; return f + s; };
const shelterText = p => !p.shelterForm ? "ศาลา: ไม่ได้บันทึก" : !hasShelter(p) ? "ไม่มีศาลา" : /ใหม่/.test(p.shelterForm) ? "ศาลาแบบใหม่" : "ศาลาแบบเก่า";
const tempText = p => tempYes(p) ? (p.tempCount ? `ติดไฟชั่วคราวแล้ว ${p.tempCount} ดวง` : "ติดไฟชั่วคราวแล้ว")
                    : /ไม่มี/.test(p.tempLamp || "") ? "ไม่มีไฟชั่วคราว" : "ไม่ได้บันทึกไฟชั่วคราว";
const lampText = p => !hasShelter(p) ? null : lampBroken(p) ? "ไฟศาลาชำรุด" : "ไฟศาลาปกติ";
const lampColor = p => !hasShelter(p) ? "var(--muted)" : lampBroken(p) ? "var(--lamp-off)" : "var(--lamp-ok)";
const shelterStatusText = p => { if (!hasShelter(p) || !p.shelterStatus || p.shelterStatus === "ปกติ") return null; let s = p.shelterStatus; if (chairBroken(p) && p.chairsBroken) s = s.replace("เก้าอี้ชำรุด", `เก้าอี้ชำรุด ${p.chairsBroken} ตัว`); return s; };
const benchText = p => !p.bench ? null : /^มี/.test(p.bench) ? `มี${p.benchN ? ` ${p.benchN} ตัว` : ""}` : p.bench;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gmaps = p => `https://www.google.com/maps/search/?api=1&query=${p.latD.toFixed(6)},${p.lngD.toFixed(6)}`;

/* รูปแสดงผ่านเซิร์ฟเวอร์รูปของ Google (ไม่ลิงก์ไปหน้า Google Drive) */
const toImg = (id, w=800) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;

/* ================= map ================= */
const map = L.map("map", {zoomControl:true}).setView([13.818, 100.526], 15);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:20, maxNativeZoom:19, attribution:"Imagery © Esri"});
const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom:20, maxNativeZoom:19});
const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:20, maxNativeZoom:19, attribution:"© OpenStreetMap"});
L.layerGroup([sat, labels]).addTo(map);
L.control.layers({"ดาวเทียม": L.layerGroup([sat, labels]), "แผนที่ถนน": street}, null, {position:"topleft"}).addTo(map);

const isTouch = matchMedia("(hover: none)").matches;
const mqMobile = matchMedia("(max-width:760px)");
const legend = L.control({position: mqMobile.matches ? "topright" : "bottomleft"});
legend.onAdd = () => { const d = L.DomUtil.create("details","legend"); if (!mqMobile.matches) d.open = true; d.innerHTML = `<summary>สัญลักษณ์</summary><div class="lg">` +
  Object.values(GROUPS).map(g => `<div><i style="background:${g.color}"></i>${g.label}</div>`).join("") +
  ROAD_LINES.map(r => `<div><i class="ln" style="background:${r.color}"></i>${r.name}</div>`).join("") + `</div>`;
  L.DomEvent.disableClickPropagation(d); return d; };
legend.addTo(map);

function hoverHtml(p){
  const ph = p.photos[0];
  const img = ph ? `<img src="${toImg(ph,600)}" alt="รูปจุดที่ ${p.id}" loading="lazy" referrerpolicy="no-referrer" draggable="false">`
                 : `<div class="ph">ยังไม่มีรูปของจุดนี้</div>`;
  return `<div class="hc">${img}<div class="body">
    <h4>จุดที่ ${p.id} · ${GROUPS[p.group].label}</h4>${p.road?`<span class="road">${esc([p.road, p.near].filter(Boolean).join(" · "))}</span>`:""}
    ${signText(p)?`<div class="row"><i style="background:${isDigital(p)?'var(--stop)':'var(--sign)'}"></i><span>${esc(signText(p))}</span></div>`:""}
    <div class="row"><i style="background:${hasShelter(p)?'var(--shelter)':'var(--muted)'}"></i><span>${esc(shelterText(p))}</span></div>
    ${p.photos.length>1?`<small>มีรูปทั้งหมด ${p.photos.length} รูป · กดหมุดเพื่อดู</small>`:`<small>กดหมุดเพื่อดูรายละเอียด</small>`}
  </div></div>`;
}

const BUS_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6 2.5h12a2.5 2.5 0 0 1 2.5 2.5v11.5a2 2 0 0 1-1.5 1.94V20a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1.5H8V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-1.56A2 2 0 0 1 3.5 16.5V5A2.5 2.5 0 0 1 6 2.5Zm.5 3a1 1 0 0 0-1 1V11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-11ZM7 14a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 7 14Zm10 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/></svg>`;
const iconFor = p => L.divIcon({className:"", iconSize:[32,40], iconAnchor:[16,40], tooltipAnchor:[0,-38],
  html:`<div class="pin" style="--pc:${GROUPS[p.group].color}">${BUS_SVG}</div>`});
let selRoad = null;
let picking = false;
const roadLayers = {};
ROAD_LINES.forEach(r => {
  const ln = L.polyline(r.coords, {color:r.color, weight:5, opacity:.8, lineCap:"round"}).addTo(map);
  ln.bindTooltip(r.name, {sticky:true, direction:"top", className:"road-tip"});
  ln.on("click", e => { L.DomEvent.stopPropagation(e); selectRoad(selRoad === r.name ? null : r.name); });
  roadLayers[r.name] = ln;
});
function styleRoads(){
  ROAD_LINES.forEach(r => roadLayers[r.name].setStyle(
    !selRoad ? {weight:5, opacity:.8} : r.name === selRoad ? {weight:8, opacity:1} : {weight:4, opacity:.2}));
  if (selRoad) roadLayers[selRoad].bringToFront();
}
function selectRoad(name){
  selRoad = name;
  styleRoads(); renderRoads(); renderList();
  if (name) {
    const pts = POINTS.filter(p => p.line === name).map(p => [p.latD, p.lngD]);
    const peek = mqMobile.matches ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--peek")) || 150) : 0;
    map.fitBounds(roadLayers[name].getBounds().extend(pts.length ? L.latLngBounds(pts) : roadLayers[name].getBounds()), {paddingTopLeft:[30, 30], paddingBottomRight:[30, 30 + peek]});
  }
}
function renderRoads(){
  const box = document.getElementById("roads");
  box.innerHTML = `<span class="lbl">ถนน</span>` +
    `<button type="button" class="chip" data-r="" aria-pressed="${!selRoad}">ทุกถนน</button>` +
    ROAD_LINES.map(r => `<button type="button" class="chip" data-r="${esc(r.name)}" aria-pressed="${selRoad === r.name}"><span class="bar" style="background:${r.color}"></span>${esc(r.name.replace(/^ถนน/, ""))} <small>${POINTS.filter(p => p.line === r.name).length}</small></button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => selectRoad(b.dataset.r || null));
}
const shown = {};
POINTS.forEach(p => shown[p.id] = !p.hidden);
const markers = {};
function addMarker(p){
  const m = L.marker([p.latD, p.lngD], {icon:iconFor(p), title:`จุดที่ ${p.id}`, keyboard:true});
  if (shown[p.id]) m.addTo(map);
  if (!isTouch) m.bindTooltip(() => hoverHtml(p), {className:"hover", direction:"top", opacity:1});
  m.on("tooltipopen", () => { if (!match(p)) m.closeTooltip(); });
  m.on("click", () => { if (picking || !match(p)) return; openDetail(p); focusPoint(p); });
  markers[p.id] = m;
}
POINTS.forEach(addMarker);
function fitAll(){
  const peek = mqMobile.matches ? parseInt(getComputedStyle(document.documentElement).getPropertyValue("--peek")) || 150 : 0;
  map.fitBounds(L.latLngBounds(POINTS.map(p => [p.latD, p.lngD])), {paddingTopLeft:[20, 20], paddingBottomRight:[20, 20 + peek]});
}
/* เลื่อนแผนที่ให้จุดอยู่เหนือแผงรายละเอียด (มือถือ) */
function focusPoint(p, zoom){
  const z = zoom || map.getZoom();
  const off = mqMobile.matches && !drawer.hidden ? drawer.offsetHeight / 2 : 0;
  const target = map.unproject(map.project([p.latD, p.lngD], z).add([0, off]), z);
  if (zoom) map.flyTo(target, z, {duration:.6}); else map.panTo(target, {duration:.4});
}
function setShown(id, on){
  shown[id] = on;
  const m = markers[id];
  if (on && !map.hasLayer(m)) m.addTo(map);
  if (!on && map.hasLayer(m)) { m.closeTooltip(); map.removeLayer(m); }
}

/* ================= sidebar ================= */
/* ตัวกรองเลือกได้หลายข้อ: ว่าง = ทั้งหมด, fmode "any" = ตรงข้อใดข้อหนึ่ง, "all" = ตรงครบทุกข้อ */
const filters = new Set();
let fmode = "any";
function renderStats(){
  const broken = POINTS.filter(lampBroken);
  const chairs = POINTS.filter(chairBroken);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${POINTS.length}</b><span>จุดพักรอทั้งหมด</span></div>
    <div class="stat"><b>${broken.length}</b><span>ศาลาไฟชำรุด</span></div>
    <div class="stat"><b>${chairs.length}</b><span>ศาลาเก้าอี้ชำรุด</span></div>`;
}
const FILTERS = [
  {k:"all", label:"ทั้งหมด"},
  ...Object.entries(GROUPS).map(([k,g]) => ({k, label:g.label, color:g.color})),
  {k:"chair", label:"เก้าอี้ชำรุด", color:"var(--shelter)"},
  {k:"digital", label:"ป้ายดิจิทัล", color:"var(--stop)"},
  {k:"nophoto", label:"ยังไม่มีรูป", color:"var(--muted)"},
];
const FILTER_TEST = {
  ...Object.fromEntries(Object.keys(GROUPS).map(k => [k, p => p.group === k])),
  chair: p => chairBroken(p), digital: p => isDigital(p), nophoto: p => !p.photos.length,
};
const matchFilter = p => !filters.size || (fmode === "all" ? [...filters].every(k => FILTER_TEST[k](p)) : [...filters].some(k => FILTER_TEST[k](p)));
/* ค้นหา: "จุด12" / "จุด 12" / "12" = เลขจุด, อย่างอื่น = ชื่อถนน ซอย แขวง หรือรายละเอียด (ไม่ต้องพิมพ์คำว่า ถนน) */
let query = "";
const squash = s => String(s || "").toLowerCase().replace(/\s+/g, "");
function matchQuery(p){
  const q = squash(query);
  if (!q) return true;
  const num = q.match(/^(?:จุดที่|จุด|จ\.|no\.?|#)?0*(\d+)$/);
  if (num) return p.id === +num[1];
  const term = q.replace(/^(ถนน|ถ\.|ซอย|ซ\.)/, "");
  return [p.road, p.near, p.detail, p.place, GROUPS[p.group].label].some(t => squash(t).includes(term));
}
const match = p => matchFilter(p) && matchQuery(p) && (!selRoad || p.line === selRoad);
function renderFilters(){
  const box = document.getElementById("filters");
  const on = k => k === "all" ? !filters.size : filters.has(k);
  box.innerHTML = FILTERS.map(f => `<button type="button" class="chip" data-k="${f.k}" aria-pressed="${on(f.k)}">${f.k !== "all" && on(f.k) ? `<span class="tick" aria-hidden="true">✓</span>` : f.color ? `<span class="dot" style="background:${f.color}"></span>` : ""}${f.label}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === "all") filters.clear(); else filters.has(k) ? filters.delete(k) : filters.add(k);
    renderFilters(); renderList();
  });
  const fm = document.getElementById("fmode");
  fm.hidden = filters.size < 2;
  fm.querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.m === fmode); b.onclick = () => { fmode = b.dataset.m; renderFilters(); renderList(); }; });
}
function listTitle(p){
  if (p.detail) return p.detail;
  if (p.place) return p.place;
  const bits = [];
  if (p.signStatus && p.signStatus !== "ปกติ") bits.push(`ป้าย${p.signStatus}`);
  if (shelterStatusText(p)) bits.push(shelterStatusText(p));
  return bits.join(" · ") || GROUPS[p.group].label;
}
function renderList(){
  const list = document.getElementById("list");
  const rows = POINTS.filter(match);
  list.innerHTML = rows.map(p => {
    const tags = [
      signText(p) ? `<span class="tag">${esc(signText(p))}</span>` : "",
      `<span class="tag">${esc(shelterText(p))}</span>`,
      lampBroken(p) ? `<span class="tag bad">ไฟศาลาชำรุด</span>` : "",
      chairBroken(p) ? `<span class="tag bad">เก้าอี้ชำรุด${p.chairsBroken?` ${p.chairsBroken} ตัว`:""}</span>` : "",
      p.photos.length ? `<span class="tag">รูป ${p.photos.length}</span>` : "",
    ].join("");
    return `<div class="row-item${shown[p.id]?"":" off"}"><button type="button" class="item" data-id="${p.id}"><span class="num" style="background:${GROUPS[p.group].color}">${p.id}</span>
      <span><h3>${esc(listTitle(p))}</h3><span class="road">${esc([p.road, p.near].filter(Boolean).join(" · "))}</span><span class="tags">${tags}</span></span></button>
      <button type="button" class="eye" data-id="${p.id}" aria-pressed="${shown[p.id]}" aria-label="${shown[p.id]?"ซ่อน":"แสดง"}จุดที่ ${p.id} บนแผนที่" title="${shown[p.id]?"ซ่อนบนแผนที่":"แสดงบนแผนที่"}">${shown[p.id]?EYE_ON:EYE_OFF}</button></div>`;
  }).join("") || `<p class="sub" style="padding:12px">${query ? `ไม่พบจุดที่ตรงกับ “${esc(query)}” ลองพิมพ์เลขจุด เช่น จุด12 หรือชื่อถนน เช่น ประชาชื่น` : (fmode === "all" && filters.size > 1 ? "ไม่มีจุดที่ตรงครบทุกข้อที่เลือก ลองเปลี่ยนเป็น “ข้อใดข้อหนึ่ง”" : "ไม่มีจุดที่ตรงกับตัวกรองนี้")}</p>`;
  list.querySelectorAll(".item").forEach(b => {
    const p = POINTS.find(x => x.id == b.dataset.id);
    b.onclick = () => { if (!shown[p.id]) { setShown(p.id, true); renderList(); } setSheet(false); openDetail(p); focusPoint(p, 18); };
    b.onmouseenter = () => { if (shown[p.id]) markers[p.id].openTooltip(); };
    b.onmouseleave = () => markers[p.id].closeTooltip();
  });
  list.querySelectorAll(".eye").forEach(b => b.onclick = () => { setShown(+b.dataset.id, !shown[+b.dataset.id]); renderList(); });
  /* ปุ่มแสดง/ซ่อนทั้งหมด: ใช้กับทุกจุดที่อยู่ในรายการตอนนี้ (ถ้ากรองหรือค้นหาอยู่ จะใช้กับจุดที่กรองอยู่เท่านั้น) */
  const scoped = filters.size > 0 || !!query;
  const on = document.getElementById("visOn"), off = document.getElementById("visOff");
  on.textContent  = scoped ? `แสดง ${rows.length} จุดที่กรองอยู่` : "แสดงทั้งหมด";
  off.textContent = scoped ? `ซ่อน ${rows.length} จุดที่กรองอยู่` : "ซ่อนทั้งหมด";
  on.disabled  = !rows.length || rows.every(p => shown[p.id]);
  off.disabled = !rows.length || rows.every(p => !shown[p.id]);
  on.onclick  = () => { rows.forEach(p => setShown(p.id, true));  renderList(); };
  off.onclick = () => { rows.forEach(p => { setShown(p.id, false); if (openId === p.id) closeDetail(); }); renderList(); };
  document.getElementById("visCount").textContent = `แสดงบนแผนที่ ${POINTS.filter(p => shown[p.id]).length} จาก ${POINTS.length} จุด`;
  /* จุดที่ไม่ตรงตัวกรอง/คำค้น: จางลง และกดหรือชี้ไม่ได้ (ไม่ขึ้นหน้าต่างข้อมูล) */
  POINTS.forEach(p => {
    const m = markers[p.id], icon = m.getElement(); if (!icon) return;
    const out = !match(p);
    icon.firstElementChild?.classList.toggle("dim", out);
    icon.classList.toggle("is-out", out);
    icon.tabIndex = out ? -1 : 0;
    if (out) { icon.removeAttribute("title"); m.closeTooltip(); } else icon.setAttribute("title", `จุดที่ ${p.id}`);
  });
}
const EYE_ON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.7 2.3 21.7 20.3l-1.4 1.4-3.3-3.3A10.6 10.6 0 0 1 12 19c-5 0-9-4.5-10-7 .6-1.5 2.1-3.6 4.2-5.2L2.3 3.7l1.4-1.4ZM8 8.6A4 4 0 0 0 13.4 14l-1.6-1.6A2 2 0 0 1 9.6 10.2L8 8.6ZM12 5c5 0 9 4.5 10 7-.5 1.3-1.7 3-3.3 4.5l-3-3A4 4 0 0 0 10.5 8.3L8.6 6.4A10 10 0 0 1 12 5Z"/></svg>`;
function renderAll(){ POINTS.forEach(p => markers[p.id].setIcon(iconFor(p))); renderStats(); renderList(); }

/* ================= detail drawer ================= */
const drawer = document.getElementById("drawer");
let openId = null;
function openDetail(p){
  if (draft) cancelDraft();
  openId = p.id;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("active", el.dataset.id == p.id));
  const gal = p.photos.length
    ? `<div class="gallery">${p.photos.map((ph,i) => `<button type="button" class="shot" data-i="${i}" aria-label="ขยายรูปที่ ${i+1}"><img src="${toImg(ph)}" alt="รูปที่ ${i+1} จุดที่ ${p.id}" loading="lazy" referrerpolicy="no-referrer" draggable="false"></button>`).join("")}</div>`
    : `<div class="note">ยังไม่มีรูปของจุดที่ ${p.id}</div>`;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  drawer.innerHTML = `
    <header><h2>จุดที่ ${p.id}</h2><button type="button" class="x" aria-label="ปิด">×</button></header>
    <div class="scroll">
      ${gal}
      <dl>
        ${row("ป้าย", signForm(p))}
        ${row("สถานะป้าย", p.signStatus)}
        ${row("ศาลา", shelterText(p))}
        ${row("สถานะศาลา", shelterStatusText(p))}
        ${row("ถนน", [p.road, p.near].filter(Boolean).join(" · "))}
        ${row("ที่ตั้ง", p.place)}
      </dl>
      ${p.detail?`<div class="note">${esc(p.detail)}</div>`:""}
      <div class="coord">${p.latD.toFixed(6)}, ${p.lngD.toFixed(6)}</div>
      <div class="btns">
        <a class="btn" href="${gmaps(p)}" target="_blank" rel="noopener">เปิดใน Google Maps</a>
        ${PHOTO_API ? `<label class="btn primary up">เพิ่มรูป<input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label>` : ""}
      </div>
      <div class="up-status" aria-live="polite" hidden></div>
    </div>`;
  drawer.hidden = false;
  if (mqMobile.matches) setSheet(false);
  drawer.querySelector(".scroll").scrollTop = 0;
  drawer.querySelector(".x").onclick = closeDetail;
  drawer.querySelectorAll(".shot").forEach(b => b.onclick = () => openLightbox(p, +b.dataset.i));
  const inp = drawer.querySelector(".up input");
  if (inp) inp.onchange = () => { uploadPhotos(p, [...inp.files]); inp.value = ""; };
}

/* ================= เพิ่มรูป (ผ่าน Google Apps Script) ================= */
/* ย่อรูปในเครื่องก่อนส่ง ด้านยาวสุด 1600px เป็น JPG เพื่อให้ส่งเร็วและไม่เปลืองพื้นที่ Drive */
function shrink(file, max = 1600){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", .85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("เปิดไฟล์รูปนี้ไม่ได้")); };
    img.src = url;
  });
}
async function uploadPhotos(p, files){
  const st = () => openId === p.id ? drawer.querySelector(".up-status") : null;
  const say = (t, err) => { const el = st(); if (el) { el.hidden = false; el.textContent = t; el.classList.toggle("err", !!err); } };
  const btn = drawer.querySelector(".up"); if (btn) btn.style.pointerEvents = "none";
  let ok = 0, fail = "";
  for (let i = 0; i < files.length; i++) {
    say(`กำลังอัปโหลดรูป ${i+1}/${files.length}…`);
    try {
      const data = await shrink(files[i]);
      const r = await fetch(PHOTO_API, {method:"POST", body: JSON.stringify({id:p.id, mime:"image/jpeg", data})}).then(r => r.json());
      if (!r.ok) throw new Error(r.error || "อัปโหลดไม่สำเร็จ");
      if (!p.photos.includes(r.fileId)) p.photos.push(r.fileId);
      ok++;
    } catch (e) { fail = e.message || "อัปโหลดไม่สำเร็จ"; }
  }
  renderList();
  if (openId === p.id) openDetail(p);
  say(fail ? `อัปโหลดสำเร็จ ${ok} จาก ${files.length} รูป · ${fail}` : `อัปโหลดสำเร็จ ${ok} รูป`, !!fail);
}
/* โหลดรายการรูปล่าสุดจากชีต แล้วใช้แทนรูปที่ฝังไว้ในไฟล์ (ลบลิงก์ในชีต = รูปหายจากเว็บ)
   ถ้าโหลดจากชีตไม่ได้ จะใช้รูปที่ฝังไว้ในไฟล์ตามเดิม */
function loadSheetPhotos(){
  if (!PHOTO_API) return;
  fetch(PHOTO_API, {cache:"no-store"}).then(r => r.json()).then(j => {
    if (!j || !j.ok || !j.photos) return;
    let changed = false;
    (j.points || []).forEach(n => { if (!POINTS.some(p => p.id === n.id)) { addPoint(n, j.photos[n.id] || []); changed = true; } });
    POINTS.forEach(p => {
      const next = (j.photos[p.id] || []).slice();
      if (next.join() !== p.photos.join()) { p.photos = next; changed = true; }
    });
    if (changed) { renderStats(); renderRoads(); renderList(); const o = POINTS.find(p => p.id === openId); if (o) openDetail(o); }
  }).catch(() => {});
}

/* ================= เพิ่มหมุดใหม่ ================= */
const GROUP_BY_LABEL = Object.fromEntries(Object.entries(GROUPS).map(([k, g]) => [g.label, k]));
/* n = {id, lat, lng, group(ชื่อกลุ่ม), place, road, f:[ค่าตาม FIELDS]} */
function addPoint(n, photos){
  const p = {id:n.id, group: GROUP_BY_LABEL[n.group] || GROUPS[n.group] && n.group || "signOld", lat:"", lng:"",
             latD:+n.lat, lngD:+n.lng, place:n.place || "", road:n.road || "", near:"", sub:"", photos: photos || [], added:true};
  applyFields(p, n.f || []);
  p.line = nearestLine(p.latD, p.lngD);
  POINTS.push(p); shown[p.id] = true; addMarker(p);
  return p;
}
const OPTS = {
  signForm:["ไม่มี","เก่า","ใหม่","ดิจิตอล"], signStatus:["ปกติ","เลือนลาง","โดนบดบัง","ชำรุด"],
  shelterForm:["ไม่มี","เก่า","ใหม่"], shelterStatus:["ปกติ","ไฟส่องสว่างชำรุด","เก้าอี้ชำรุด","โครงสร้างชำรุด"],
  yesno:["มี","ไม่มี"],
};
let draft = null; /* {latlng, marker, form} */
const pickBar = document.createElement("div");
pickBar.className = "pickbar"; pickBar.hidden = true;
pickBar.innerHTML = `<span>แตะบนแผนที่ตรงตำแหน่งป้ายหรือศาลา</span><button type="button" class="btn">ยกเลิก</button>`;
document.querySelector(".mapwrap").appendChild(pickBar);
pickBar.querySelector("button").onclick = () => { if (draft && draft.form) { setPicking(false); drawer.hidden = false; } else cancelDraft(); };
function setPicking(on){
  picking = on; pickBar.hidden = !on;
  document.getElementById("map").classList.toggle("picking", on);
  if (on) { if (mqMobile.matches) setSheet(false); drawer.hidden = true; }
}
function startAdd(){
  if (draft) cancelDraft();
  closeDetail();
  draft = {};
  setPicking(true);
}
const draftIcon = () => L.divIcon({className:"", iconSize:[32,40], iconAnchor:[16,40],
  html:`<div class="pin draft" style="--pc:${draft && draft.form ? GROUPS[draft.form.querySelector("[name=group]").value]?.color || "var(--party)" : "var(--party)"}">${BUS_SVG}</div>`});
function placeDraft(latlng){
  if (!draft) return;
  draft.latlng = latlng;
  if (!draft.marker) {
    draft.marker = L.marker(latlng, {icon:draftIcon(), draggable:true, zIndexOffset:1000}).addTo(map);
    draft.marker.on("dragend", () => { draft.latlng = draft.marker.getLatLng(); updateDraftCoords(); });
  } else draft.marker.setLatLng(latlng);
  setPicking(false);
  if (!draft.form) openAddForm(); else { drawer.hidden = false; updateDraftCoords(); }
  focusPoint({latD:latlng.lat, lngD:latlng.lng});
}
function updateDraftCoords(){
  if (!draft || !draft.form) return;
  const {lat, lng} = draft.latlng;
  draft.form.querySelector(".draft-coord").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  const road = draft.form.querySelector("[name=road]");
  if (!road.dataset.touched) road.value = nearestLine(lat, lng) || "";
}
function cancelDraft(){
  if (!draft) return;
  if (draft.marker) map.removeLayer(draft.marker);
  draft = null; setPicking(false);
  if (openId == null) drawer.hidden = true;
}
function openAddForm(){
  openId = null;
  const sel = (name, opts, blank = "ไม่ได้ระบุ") => `<select name="${name}"><option value="">${blank}</option>${opts.map(o => `<option>${o}</option>`).join("")}</select>`;
  drawer.innerHTML = `
    <header><h2>เพิ่มหมุดใหม่</h2><button type="button" class="x" aria-label="ยกเลิก">×</button></header>
    <form class="scroll addform" novalidate>
      <label><span>กลุ่ม <b class="req">*</b></span><select name="group" required><option value="">เลือกกลุ่ม</option>${Object.entries(GROUPS).map(([k,g]) => `<option value="${k}">${g.label}</option>`).join("")}</select></label>
      <label>ชื่อที่ตั้ง<input name="place" maxlength="200" placeholder="เช่น หน้าวัดน้อย"></label>
      <label>ถนน<input name="road" maxlength="200" list="roadList"><datalist id="roadList">${ROAD_LINES.map(r => `<option>${r.name}</option>`).join("")}</datalist></label>
      <fieldset><legend>ป้าย</legend>
        <label>รูปแบบป้าย${sel("signForm", OPTS.signForm)}</label>
        <label>สถานะป้าย${sel("signStatus", OPTS.signStatus)}</label>
      </fieldset>
      <fieldset><legend>ศาลา</legend>
        <label>รูปแบบศาลา${sel("shelterForm", OPTS.shelterForm)}</label>
        <div class="checks"><span>สถานะศาลา</span>${OPTS.shelterStatus.map(o => `<label class="chk"><input type="checkbox" name="shelterStatus" value="${o}">${o}</label>`).join("")}</div>
        <label data-if="chair" hidden>เก้าอี้ชำรุด (ตัว)<input name="chairsBroken" type="number" min="1" max="99" inputmode="numeric"></label>
        <label data-if="lamp" hidden>ติดตั้งไฟชั่วคราวแล้วหรือไม่${sel("tempLamp", OPTS.yesno)}</label>
      </fieldset>
      <fieldset><legend>ม้านั่ง</legend>
        <label>มีม้านั่งหรือไม่${sel("bench", OPTS.yesno)}</label>
        <label data-if="bench" hidden>จำนวนม้านั่ง (ตัว)<input name="benchN" type="number" min="1" max="99" inputmode="numeric"></label>
      </fieldset>
      <label>รายละเอียดเพิ่มเติม<textarea name="detail" rows="3" maxlength="500"></textarea></label>
      <label>รูป (เลือกได้หลายรูป)<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <div class="coord">ตำแหน่ง: <span class="draft-coord"></span><br><button type="button" class="linkbtn move">ย้ายตำแหน่ง</button>${isTouch ? "" : " หรือลากหมุดสีส้มบนแผนที่"}</div>
      <div class="btns"><button type="submit" class="btn primary">บันทึกหมุด</button><button type="button" class="btn cancel">ยกเลิก</button></div>
      <div class="up-status" aria-live="polite" hidden></div>
    </form>`;
  drawer.hidden = false;
  const f = drawer.querySelector("form");
  draft.form = f;
  const sync = () => {
    const st = [...f.querySelectorAll("[name=shelterStatus]:checked")].map(i => i.value);
    f.querySelector("[data-if=chair]").hidden = !st.includes("เก้าอี้ชำรุด");
    f.querySelector("[data-if=lamp]").hidden = !st.includes("ไฟส่องสว่างชำรุด");
    f.querySelector("[data-if=bench]").hidden = f.bench.value !== "มี";
    if (draft && draft.marker) draft.marker.setIcon(draftIcon());
  };
  f.addEventListener("change", sync);
  f.road.addEventListener("input", () => { f.road.dataset.touched = "1"; });
  drawer.querySelector(".x").onclick = cancelDraft;
  f.querySelector(".cancel").onclick = cancelDraft;
  f.querySelector(".move").onclick = () => setPicking(true);
  f.onsubmit = e => { e.preventDefault(); submitDraft(f); };
  updateDraftCoords();
  if (mqMobile.matches) setSheet(false);
}
async function submitDraft(f){
  const st = f.querySelector(".up-status");
  const say = (t, err) => { st.hidden = false; st.textContent = t; st.classList.toggle("err", !!err); };
  if (!f.group.value) { say("กรุณาเลือกกลุ่ม", true); f.group.focus(); return; }
  const statuses = [...f.querySelectorAll("[name=shelterStatus]:checked")].map(i => i.value);
  const vals = {
    shelterForm:f.shelterForm.value, shelterStatus:statuses, chairsBroken:f.chairsBroken.value, tempLamp:f.tempLamp.value,
    signForm:f.signForm.value, signStatus:f.signStatus.value, bench:f.bench.value, benchN:f.benchN.value, detail:f.detail.value.trim(),
  };
  const btn = f.querySelector("[type=submit]"); btn.disabled = true;
  say("กำลังบันทึกหมุด…");
  try {
    const {lat, lng} = draft.latlng;
    const body = {action:"addPoint", lat, lng, group:GROUPS[f.group.value].label, place:f.place.value.trim(), road:f.road.value.trim(), f:vals};
    const r = await fetch(PHOTO_API, {method:"POST", body: JSON.stringify(body)}).then(r => r.json());
    if (!r.ok) throw new Error(r.error || "บันทึกไม่สำเร็จ");
    const num = v => { const n = parseInt(v, 10); return n > 0 ? n : null; };
    const files = [...f.photos.files];
    const p = addPoint({id:r.id, lat, lng, group:body.group, place:body.place, road:body.road, f:[
      vals.shelterForm, statuses.join(", "), statuses.includes("เก้าอี้ชำรุด") ? num(vals.chairsBroken) : null,
      statuses.includes("ไฟส่องสว่างชำรุด") ? vals.tempLamp : null, vals.signForm, vals.signStatus, vals.bench,
      vals.bench === "มี" ? num(vals.benchN) : null, vals.detail]}, []);
    map.removeLayer(draft.marker); draft = null;
    renderStats(); renderRoads(); renderList();
    openDetail(p); focusPoint(p);
    if (files.length) uploadPhotos(p, files);
  } catch (e) {
    btn.disabled = false;
    say(e.message || "บันทึกไม่สำเร็จ", true);
  }
}
if (PHOTO_API) {
  const add = L.control({position:"topright"});
  add.onAdd = () => { const b = L.DomUtil.create("button", "addpin"); b.type = "button"; b.innerHTML = "+ เพิ่มหมุด";
    L.DomEvent.disableClickPropagation(b); b.onclick = startAdd; return b; };
  add.addTo(map);
}
function closeDetail(){ if (draft) cancelDraft(); openId = null; drawer.hidden = true; document.querySelectorAll(".item.active").forEach(e => e.classList.remove("active")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ================= ดูรูปขยาย ================= */
const lb = document.getElementById("lightbox");
let lbP = null, lbI = 0;
function showLb(){
  const n = lbP.photos.length;
  lb.querySelector("img").src = toImg(lbP.photos[lbI], 1600);
  lb.querySelector("img").alt = `จุดที่ ${lbP.id} รูปที่ ${lbI+1}`;
  lb.querySelector(".cap").textContent = `จุดที่ ${lbP.id}` + (n > 1 ? ` · รูป ${lbI+1}/${n}` : "");
  lb.querySelectorAll(".nav").forEach(b => b.hidden = n < 2);
}
function openLightbox(p, i){ lbP = p; lbI = i; showLb(); lb.hidden = false; lb.querySelector(".lbx").focus(); }
function closeLightbox(){ lb.hidden = true; }
lb.querySelector(".lbx").onclick = closeLightbox;
lb.querySelector(".prev").onclick = e => { e.stopPropagation(); lbI = (lbI - 1 + lbP.photos.length) % lbP.photos.length; showLb(); };
lb.querySelector(".next").onclick = e => { e.stopPropagation(); lbI = (lbI + 1) % lbP.photos.length; showLb(); };
lb.onclick = e => { if (e.target === lb) closeLightbox(); };
/* ปัดซ้าย/ขวาเพื่อเปลี่ยนรูป ปัดลงเพื่อปิด */
let tx = null, ty = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
lb.addEventListener("touchend", e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = ty = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && lbP.photos.length > 1) lb.querySelector(dx < 0 ? ".next" : ".prev").click();
  else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
});
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") { e.stopImmediatePropagation(); closeLightbox(); }
  if (e.key === "ArrowLeft") lb.querySelector(".prev").click();
  if (e.key === "ArrowRight") lb.querySelector(".next").click();
}, true);
document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

/* ================= แผงรายการ (มือถือ) ================= */
const sheetEl = document.getElementById("sheet"), handle = document.getElementById("handle");
function setSheet(open){
  if (!open) sheetEl.scrollTop = 0;
  sheetEl.classList.toggle("open", open);
  handle.setAttribute("aria-expanded", open);
  document.getElementById("handleLabel").textContent = open ? "ย่อรายการ" : `ดูรายการทั้งหมด ${POINTS.length} จุด`;
  if (open && !drawer.hidden) closeDetail();
}
function setPeek(){
  if (!mqMobile.matches) { document.documentElement.style.removeProperty("--peek"); return; }
  const h = handle.offsetHeight + document.querySelector(".head").offsetHeight + document.getElementById("stats").offsetHeight;
  document.documentElement.style.setProperty("--peek", h + "px");
}
handle.onclick = () => setSheet(!sheetEl.classList.contains("open"));
let sy = null;
handle.addEventListener("touchstart", e => { sy = e.touches[0].clientY; }, {passive:true});
handle.addEventListener("touchend", e => {
  if (sy == null) return; const dy = e.changedTouches[0].clientY - sy; sy = null;
  if (Math.abs(dy) > 30) { e.preventDefault(); setSheet(dy < 0); }
});
map.on("click", e => { if (picking) { placeDraft(e.latlng); return; } if (mqMobile.matches && !draft) { closeDetail(); setSheet(false); } });
mqMobile.addEventListener("change", () => { setPeek(); setSheet(false); map.invalidateSize(); });
window.addEventListener("resize", () => { setPeek(); });

/* ================= ค้นหา ================= */
const qEl = document.getElementById("q"), qClear = document.getElementById("qClear");
qEl.addEventListener("input", () => { query = qEl.value.trim(); qClear.hidden = !qEl.value; renderList(); });
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { qClear.click(); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  const hits = POINTS.filter(match);
  if (!hits.length) return;
  if (mqMobile.matches) { qEl.blur(); setSheet(false); }
  if (hits.length === 1) {
    const p = hits[0];
    if (!shown[p.id]) setShown(p.id, true);
    renderList(); openDetail(p); focusPoint(p, 18);
  } else {
    hits.forEach(p => setShown(p.id, true)); renderList();
    const peek = mqMobile.matches ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--peek")) || 150) : 0;
    map.fitBounds(L.latLngBounds(hits.map(p => [p.latD, p.lngD])), {paddingTopLeft:[30, 30], paddingBottomRight:[30, 30 + peek], maxZoom:18});
  }
});
qClear.onclick = () => { qEl.value = ""; query = ""; qClear.hidden = true; renderList(); qEl.focus(); };

renderStats(); renderFilters(); renderRoads(); renderList(); loadSheetPhotos();
setSheet(false); setPeek(); fitAll();
if (document.fonts) document.fonts.ready.then(() => { setPeek(); });
</script>
