<style>
/* Layout: แผงข้อมูลด้านซ้าย (สรุป + ตัวกรอง + รายการจุด) / แผนที่ดาวเทียมเต็มพื้นที่ด้านขวา; มือถือ: แผนที่บน รายการล่าง */
:root{

}

}
*{box-sizing:border-box}
[hidden]{display:none!important}

const FIELDS = ["shelterForm","shelterStatus","chairsBroken","tempLamp","signForm","signStatus","bench","benchN","detail"];

/* ================= helpers ================= */
const clean = v => { if (v == null) return null; const s = String(v).trim(); return (!s || s === "(None)") ? null : s; };
const dms = s => { const m = s.match(/(\d+)°(\d+)'([\d.]+)"([NSEW])/); let v = +m[1] + m[2]/60 + m[3]/3600; return /[SW]/.test(m[4]) ? -v : v; };
function applyFields(p, arr){ FIELDS.forEach((f,i) => p[f] = clean(arr[i])); }
POINTS.forEach(p => { p.latD = dms(p.lat); p.lngD = dms(p.lng); p.photos = PHOTOS[p.id] || []; applyFields(p, DATA[p.id] || []); });

const hasShelter = p => !!p.shelterForm && !/ไม่มี/.test(p.shelterForm);
const lampBroken = p => hasShelter(p) && /ไฟ/.test(p.shelterStatus || "");
const chairBroken = p => /เก้าอี้/.test(p.shelterStatus || "");
const isDigital = p => /ดิจิ/.test(p.signForm || "");
const tempYes = p => /^มี/.test(p.tempLamp || "");
const signForm = p => !p.signForm ? null : isDigital(p) ? "ป้ายดิจิทัล" : /ใหม่/.test(p.signForm) ? "ป้ายแบบใหม่" : "ป้ายเก่า";
const signText = p => { const f = signForm(p); if (!f) return null; const s = p.signStatus && p.signStatus !== "ปกติ" ? ` · ${p.signStatus}` : ""; return f + s; };
const shelterText = p => !p.shelterForm ? "ศาลา: ไม่ได้บันทึก" : !hasShelter(p) ? "ไม่มีศาลา" : /ใหม่/.test(p.shelterForm) ? "ศาลาแบบใหม่" : "ศาลาแบบเก่า";
const tempText = p => tempYes(p) ? (p.tempCount ? `ติดไฟชั่วคราวแล้ว ${p.tempCount} ดวง` : "ติดไฟชั่วคราวแล้ว")
                    : /ไม่มี/.test(p.tempLamp || "") ? "ไม่มีไฟชั่วคราว" : "ไม่ได้บันทึกไฟชั่วคราว";
const lampText = p => !hasShelter(p) ? null : lampBroken(p) ? "ไฟศาลาชำรุด" : "ไฟศาลาปกติ";
const lampColor = p => !hasShelter(p) ? "var(--muted)" : lampBroken(p) ? "var(--lamp-off)" : "var(--lamp-ok)";
const shelterStatusText = p => { if (!hasShelter(p) || !p.shelterStatus || p.shelterStatus === "ปกติ") return null; let s = p.shelterStatus; if (chairBroken(p) && p.chairsBroken) s = s.replace("เก้าอี้ชำรุด", `เก้าอี้ชำรุด ${p.chairsBroken} ตัว`); return s; };
const benchText = p => !p.bench ? null : /^มี/.test(p.bench) ? `มี${p.benchN ? ` ${p.benchN} ตัว` : ""}` : p.bench;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gmaps = p => `https://www.google.com/maps/search/?api=1&query=${p.latD.toFixed(6)},${p.lngD.toFixed(6)}`;

function fitAll(){
  const peek = mqMobile.matches ? parseInt(getComputedStyle(document.documentElement).getPropertyValue("--peek")) || 150 : 0;
  map.fitBounds(L.latLngBounds(POINTS.map(p => [p.latD, p.lngD])), {paddingTopLeft:[20, 20], paddingBottomRight:[20, 20 + peek]});
}
/* เลื่อนแผนที่ให้จุดอยู่เหนือแผงรายละเอียด (มือถือ) */
function focusPoint(p, zoom){
  const z = zoom || map.getZoom();
  const off = mqMobile.matches && !drawer.hidden ? drawer.offsetHeight / 2 : 0;
  const target = map.unproject(map.project([p.latD, p.lngD], z).add([0, off]), z);
  if (zoom) map.flyTo(target, z, {duration:.6}); else map.panTo(target, {duration:.4});
}
function setShown(id, on){
  shown[id] = on;
  const m = markers[id];
  if (on && !map.hasLayer(m)) m.addTo(map);
  if (!on && map.hasLayer(m)) { m.closeTooltip(); map.removeLayer(m); }
}

/* ================= sidebar ================= */
let filter = "all";
function renderStats(){
  const broken = POINTS.filter(lampBroken);
  const chairs = POINTS.filter(chairBroken);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${POINTS.length}</b><span>จุดที่ควรปรับปรุง</span></div>
    <div class="stat"><b>${broken.length}</b><span>ศาลาไฟชำรุด</span></div>
    <div class="stat"><b>${chairs.length}</b><span>ศาลาเก้าอี้ชำรุด</span></div>`;
}
const FILTERS = [
  {k:"all", label:"ทั้งหมด"},
  ...Object.entries(GROUPS).map(([k,g]) => ({k, label:g.label, color:g.color})),
  {k:"lamp", label:"ไฟศาลาชำรุด", color:"var(--lamp-off)"},
  {k:"chair", label:"เก้าอี้ชำรุด", color:"var(--shelter)"},
  {k:"digital", label:"ป้ายดิจิทัล", color:"var(--stop)"},
];
const match = p => filter==="all" || p.group===filter || (filter==="lamp" && lampBroken(p)) || (filter==="chair" && chairBroken(p)) || (filter==="digital" && isDigital(p));
function renderFilters(){
  const box = document.getElementById("filters");
  box.innerHTML = FILTERS.map(f => `<button type="button" class="chip" data-k="${f.k}" aria-pressed="${filter===f.k}">${f.color?`<span class="dot" style="background:${f.color}"></span>`:""}${f.label}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.k; renderFilters(); renderList(); });
}
function listTitle(p){
  if (p.detail) return p.detail;
  if (p.place) return p.place;
  const bits = [];
  if (p.signStatus && p.signStatus !== "ปกติ") bits.push(`ป้าย${p.signStatus}`);
  if (shelterStatusText(p)) bits.push(shelterStatusText(p));
  return bits.join(" · ") || GROUPS[p.group].label;
}
function renderList(){
  const list = document.getElementById("list");
  const rows = POINTS.filter(match);
  list.innerHTML = rows.map(p => {
    const tags = [
      signText(p) ? `<span class="tag">${esc(signText(p))}</span>` : "",
      `<span class="tag">${esc(shelterText(p))}</span>`,
      lampBroken(p) ? `<span class="tag bad">ไฟศาลาชำรุด</span>` : "",
      chairBroken(p) ? `<span class="tag bad">เก้าอี้ชำรุด${p.chairsBroken?` ${p.chairsBroken} ตัว`:""}</span>` : "",
      p.photos.length ? `<span class="tag">รูป ${p.photos.length}</span>` : "",
    ].join("");
    return `<div class="row-item${shown[p.id]?"":" off"}"><button type="button" class="item" data-id="${p.id}"><span class="num" style="background:${GROUPS[p.group].color}">${p.id}</span>
      <span><h3>${esc(listTitle(p))}</h3><span class="tags">${tags}</span></span></button>
      <button type="button" class="eye" data-id="${p.id}" aria-pressed="${shown[p.id]}" aria-label="${shown[p.id]?"ซ่อน":"แสดง"}จุดที่ ${p.id} บนแผนที่" title="${shown[p.id]?"ซ่อนบนแผนที่":"แสดงบนแผนที่"}">${shown[p.id]?EYE_ON:EYE_OFF}</button></div>`;
  }).join("") || `<p class="sub" style="padding:12px">ไม่มีจุดที่ตรงกับตัวกรองนี้</p>`;
  list.querySelectorAll(".item").forEach(b => {
    const p = POINTS.find(x => x.id == b.dataset.id);
    b.onclick = () => { if (!shown[p.id]) { setShown(p.id, true); renderList(); } setSheet(false); openDetail(p); focusPoint(p, 18); };
    b.onmouseenter = () => { if (shown[p.id]) markers[p.id].openTooltip(); };
    b.onmouseleave = () => markers[p.id].closeTooltip();
  });
  list.querySelectorAll(".eye").forEach(b => b.onclick = () => { setShown(+b.dataset.id, !shown[+b.dataset.id]); renderList(); });
  const visible = POINTS.filter(match);
  const allOn = visible.every(p => shown[p.id]);
  const vt = document.getElementById("visAll");
  vt.textContent = allOn ? "ซ่อนทั้งหมดบนแผนที่" : "แสดงทั้งหมดบนแผนที่";
  vt.onclick = () => { visible.forEach(p => setShown(p.id, !allOn)); renderList(); };
  document.getElementById("visCount").textContent = `แสดงบนแผนที่ ${POINTS.filter(p => shown[p.id]).length} จาก ${POINTS.length} จุด`;
  POINTS.forEach(p => { const el = markers[p.id].getElement()?.firstElementChild; if (el) el.classList.toggle("dim", !match(p)); });
}
const EYE_ON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.7 2.3 21.7 20.3l-1.4 1.4-3.3-3.3A10.6 10.6 0 0 1 12 19c-5 0-9-4.5-10-7 .6-1.5 2.1-3.6 4.2-5.2L2.3 3.7l1.4-1.4ZM8 8.6A4 4 0 0 0 13.4 14l-1.6-1.6A2 2 0 0 1 9.6 10.2L8 8.6ZM12 5c5 0 9 4.5 10 7-.5 1.3-1.7 3-3.3 4.5l-3-3A4 4 0 0 0 10.5 8.3L8.6 6.4A10 10 0 0 1 12 5Z"/></svg>`;
function renderAll(){ POINTS.forEach(p => markers[p.id].setIcon(iconFor(p))); renderStats(); renderList(); }

/* ================= detail drawer ================= */
const drawer = document.getElementById("drawer");
let openId = null;
function openDetail(p){
  openId = p.id;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("active", el.dataset.id == p.id));
  const gal = p.photos.length
    ? `<div class="gallery">${p.photos.map((ph,i) => `<button type="button" class="shot" data-i="${i}" aria-label="ขยายรูปที่ ${i+1}"><img src="${toImg(ph)}" alt="รูปที่ ${i+1} จุดที่ ${p.id}" loading="lazy" referrerpolicy="no-referrer" draggable="false"></button>`).join("")}</div>`
    : `<div class="note">ยังไม่มีรูปของจุดที่ ${p.id}</div>`;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  drawer.innerHTML = `
    <header><h2>จุดที่ ${p.id}</h2><button type="button" class="x" aria-label="ปิด">×</button></header>
    <div class="scroll">
      ${gal}
      <dl>
        ${row("กลุ่ม", GROUPS[p.group].label)}
        ${row("ป้าย", signForm(p))}
        ${row("สถานะป้าย", p.signStatus)}
        ${row("ศาลา", shelterText(p))}
        ${row("สถานะศาลา", shelterStatusText(p))}
        ${row("ไฟศาลา", lampText(p))}
        ${row("ที่ตั้ง", p.place)}
      </dl>
      ${p.detail?`<div class="note">${esc(p.detail)}</div>`:""}
      <div class="coord">${esc(p.lat)} ${esc(p.lng)}<br>${p.latD.toFixed(6)}, ${p.lngD.toFixed(6)}</div>
      <div class="btns">
        <a class="btn" href="${gmaps(p)}" target="_blank" rel="noopener">เปิดใน Google Maps</a>
      </div>
    </div>`;
  drawer.hidden = false;
  if (mqMobile.matches) setSheet(false);
  drawer.querySelector(".scroll").scrollTop = 0;
  drawer.querySelector(".x").onclick = closeDetail;
  drawer.querySelectorAll(".shot").forEach(b => b.onclick = () => openLightbox(p, +b.dataset.i));
}
function closeDetail(){ openId = null; drawer.hidden = true; document.querySelectorAll(".item.active").forEach(e => e.classList.remove("active")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ================= ดูรูปขยาย ================= */
const lb = document.getElementById("lightbox");
let lbP = null, lbI = 0;
function showLb(){
  const n = lbP.photos.length;
  lb.querySelector("img").src = toImg(lbP.photos[lbI], 1600);
  lb.querySelector("img").alt = `จุดที่ ${lbP.id} รูปที่ ${lbI+1}`;
  lb.querySelector(".cap").textContent = `จุดที่ ${lbP.id}` + (n > 1 ? ` · รูป ${lbI+1}/${n}` : "");
  lb.querySelectorAll(".nav").forEach(b => b.hidden = n < 2);
}
function openLightbox(p, i){ lbP = p; lbI = i; showLb(); lb.hidden = false; lb.querySelector(".lbx").focus(); }
function closeLightbox(){ lb.hidden = true; }
lb.querySelector(".lbx").onclick = closeLightbox;
lb.querySelector(".prev").onclick = e => { e.stopPropagation(); lbI = (lbI - 1 + lbP.photos.length) % lbP.photos.length; showLb(); };
lb.querySelector(".next").onclick = e => { e.stopPropagation(); lbI = (lbI + 1) % lbP.photos.length; showLb(); };
lb.onclick = e => { if (e.target === lb) closeLightbox(); };
/* ปัดซ้าย/ขวาเพื่อเปลี่ยนรูป ปัดลงเพื่อปิด */
let tx = null, ty = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
lb.addEventListener("touchend", e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = ty = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && lbP.photos.length > 1) lb.querySelector(dx < 0 ? ".next" : ".prev").click();
  else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
});
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") { e.stopImmediatePropagation(); closeLightbox(); }
  if (e.key === "ArrowLeft") lb.querySelector(".prev").click();
  if (e.key === "ArrowRight") lb.querySelector(".next").click();
}, true);
document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

/* ================= แผงรายการ (มือถือ) ================= */
const sheetEl = document.getElementById("sheet"), handle = document.getElementById("handle");
function setSheet(open){
  sheetEl.classList.toggle("open", open);
  handle.setAttribute("aria-expanded", open);
  document.getElementById("handleLabel").textContent = open ? "ย่อรายการ" : `ดูรายการทั้งหมด ${POINTS.length} จุด`;
  if (open && !drawer.hidden) closeDetail();
}
function setPeek(){
  if (!mqMobile.matches) { document.documentElement.style.removeProperty("--peek"); return; }
  const h = handle.offsetHeight + document.querySelector(".head").offsetHeight + document.getElementById("stats").offsetHeight;
  document.documentElement.style.setProperty("--peek", h + "px");
}
handle.onclick = () => setSheet(!sheetEl.classList.contains("open"));
let sy = null;
handle.addEventListener("touchstart", e => { sy = e.touches[0].clientY; }, {passive:true});
handle.addEventListener("touchend", e => {
  if (sy == null) return; const dy = e.changedTouches[0].clientY - sy; sy = null;
  if (Math.abs(dy) > 30) { e.preventDefault(); setSheet(dy < 0); }
});
map.on("click", () => { if (mqMobile.matches) { closeDetail(); setSheet(false); } });
mqMobile.addEventListener("change", () => { setPeek(); setSheet(false); map.invalidateSize(); });
window.addEventListener("resize", () => { setPeek(); });

renderStats(); renderFilters(); renderList();
setSheet(false); setPeek(); fitAll();
if (document.fonts) document.fonts.ready.then(() => { setPeek(); });
</script>
</body>
</html>
